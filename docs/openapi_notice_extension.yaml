openapi: 3.0.3
info:
  title: Noccaro Notice Extension Draft
  version: 0.2.0
servers:
  - url: https://noccaro.duckdns.org/api/v1
paths:
  /spaces/{spaceId}/posts:
    get:
      summary: List visible notice posts for a space
      parameters:
        - in: path
          name: spaceId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: category
          required: false
          schema:
            type: string
            enum: [owner, operation]
        - in: query
          name: limit
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: OK
  /posts/{postId}:
    get:
      summary: Get visible post detail
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
  /posts/{postId}/read:
    post:
      summary: Mark post as read
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
  /admin/spaces/{spaceId}/posts:
    post:
      summary: Create owner notice
      parameters:
        - in: path
          name: spaceId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerPostMutation'
      responses:
        '201':
          description: Created
  /system-admin/spaces/{spaceId}/posts:
    post:
      summary: Create operation notice
      parameters:
        - in: path
          name: spaceId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationPostMutation'
      responses:
        '201':
          description: Created
components:
  schemas:
    Post:
      type: object
      properties:
        id:
          type: string
          format: uuid
        spaceId:
          type: string
          format: uuid
        authorMembershipId:
          nullable: true
          type: string
          format: uuid
        category:
          type: string
          enum: [owner, operation]
        audienceType:
          type: string
          enum: [all_members, targeted_users]
        title:
          type: string
        body:
          type: string
        status:
          type: string
          enum: [draft, published, archived, deleted]
        notifyMembers:
          type: boolean
        publishedAt:
          nullable: true
          type: string
          format: date-time
        visibleFrom:
          nullable: true
          type: string
          format: date-time
        visibleTo:
          nullable: true
          type: string
          format: date-time
        reactionCount:
          type: integer
        reactedByMe:
          type: boolean
        isRead:
          type: boolean
        readAt:
          nullable: true
          type: string
          format: date-time
        targetedToMe:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OwnerPostMutation:
      type: object
      required: [title, body, status]
      properties:
        category:
          type: string
          enum: [owner]
        audienceType:
          type: string
          enum: [all_members, targeted_users]
        recipientUserIds:
          type: array
          items:
            type: string
            format: uuid
        title:
          type: string
        body:
          type: string
        status:
          type: string
          enum: [draft, published, archived]
        notifyMembers:
          type: boolean
        visibleFrom:
          nullable: true
          type: string
          format: date-time
        visibleTo:
          nullable: true
          type: string
          format: date-time
    OperationPostMutation:
      allOf:
        - $ref: '#/components/schemas/OwnerPostMutation'
        - type: object
          properties:
            category:
              type: string
              enum: [operation]
